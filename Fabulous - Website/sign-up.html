<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | FABULOUS</title>
    <link rel="stylesheet" href="sign-up.css">
    <link rel="icon" type="image/ico" sizes="32x32" href="images/favicon.ico">
</head>
<body>
    <div class="box">
        <h1 style="font-size: 40px;">Sign Up</h1>
        <div class="form-box">
            <form action="/sign-up" method="post">
                <div class="username">
                    <input type="text" name="Username" placeholder="Username">
                    <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
fill="currentColor" viewBox="0 0 24 24" >
<!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
<path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5m0-8c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3M4 22h16c.55 0 1-.45 1-1v-1c0-3.86-3.14-7-7-7h-4c-3.86 0-7 3.14-7 7v1c0 .55.45 1 1 1m6-7h4c2.76 0 5 2.24 5 5H5c0-2.76 2.24-5 5-5"></path>
</svg>
                </div>
                <div class="gmail">
                    <input type="text" name="gmail" placeholder="Gmail">
                    <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
fill="currentColor" viewBox="0 0 24 24" >
<!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
<path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2m0 2v.51l-8 6.22-8-6.22V6zM4 18V9.04l7.39 5.74c.18.14.4.21.61.21s.43-.07.61-.21L20 9.03v8.96H4Z"></path>
</svg>
                </div>
                <div class="password">
                    <input type="password" name="password" placeholder="Password">
                    <svg  xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
fill="currentColor" viewBox="0 0 24 24" >
<!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
<path d="M6 22h12c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5S7 4.24 7 7v2H6c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2M9 7c0-1.65 1.35-3 3-3s3 1.35 3 3v2H9zm-3 4h12v9H6z"></path>
</svg>
                </div>
                <div class="hovereffect">
                    <div class="button">
                        <button type="submit">Sign Up</button>
                    </div>
                </div>
                <div class="sign-in-link">
                    <p>Already have an account? <a href="login.html">Sign In</a></p><br>
                    <div class="line">
                        <span>or</span>
                    </div>
                    <div class="google-sign-up">
                        <img src="images/search.png" alt="google.png" width="18px">
                        <button type="submit">Sign up with Google</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
