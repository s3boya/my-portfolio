<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="au-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <radialGradient id="au-glow-rad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <filter id="au-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#au-bg)"/>
  <circle cx="500" cy="325" r="340" fill="url(#au-glow-rad)"/>

  <!-- Starfield -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="90" cy="140" r="1.5"/><circle cx="240" cy="80" r="2"/><circle cx="390" cy="190" r="1.2"/>
    <circle cx="670" cy="90" r="2.2"/><circle cx="840" cy="160" r="1.5"/><circle cx="920" cy="80" r="1.8"/>
    <circle cx="160" cy="460" r="1.5"/><circle cx="820" cy="480" r="1.8"/><circle cx="710" cy="540" r="1.2"/>
  </g>

  <!-- The Skeld Starship Window Frame -->
  <circle cx="500" cy="340" r="230" fill="none" stroke="#334155" stroke-width="14" opacity="0.4"/>
  <circle cx="500" cy="340" r="220" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>

  <!-- Red Impostor Crewmate Figure Floating -->
  <g transform="translate(500, 360)">
    <!-- Backpack (Oxygen Tank) -->
    <rect x="-85" y="-50" width="30" height="90" rx="14" fill="#991b1b"/>
    <!-- Body -->
    <path d="M-60,-70 Q0,-95 40,-70 Q65,-40 65,30 L65,70 Q65,85 45,85 L35,85 Q20,85 20,70 L20,35 L-15,35 L-15,70 Q-15,85 -30,85 L-40,85 Q-60,85 -60,70 Z" fill="#ef4444"/>
    <!-- Cyan Visor -->
    <ellipse cx="20" cy="-35" rx="42" ry="24" fill="#67e8f9" stroke="#0284c7" stroke-width="6"/>
    <!-- Visor Highlight -->
    <ellipse cx="28" cy="-40" rx="24" ry="10" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Title Artwork -->
  <g text-anchor="middle" font-family="'Arial Black', 'Inter', sans-serif">
    <text x="500" y="160" font-size="74" font-weight="900" letter-spacing="8" fill="#ffffff" filter="url(#au-glow)">AMONG US</text>
    <text x="500" y="200" font-size="15" font-weight="800" letter-spacing="8" fill="#ef4444">THERE IS 1 IMPOSTOR AMONG US</text>
  </g>
</svg>
