<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="cod-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a06"/>
      <stop offset="50%" stop-color="#0c160e"/>
      <stop offset="100%" stop-color="#030504"/>
    </linearGradient>
    <radialGradient id="cod-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#991b1b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050a06" stop-opacity="0"/>
    </radialGradient>
    <filter id="cod-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#cod-bg)"/>
  <circle cx="500" cy="325" r="350" fill="url(#cod-flare)"/>

  <!-- Tactical Grid Lines & Scanlines -->
  <g stroke="#22c55e" stroke-width="0.8" opacity="0.25">
    <line x1="0" y1="100" x2="1000" y2="100"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="500" x2="1000" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="650"/>
    <line x1="400" y1="0" x2="400" y2="650"/>
    <line x1="600" y1="0" x2="600" y2="650"/>
    <line x1="800" y1="0" x2="800" y2="650"/>
  </g>

  <!-- Night Vision Soldier Silhouette & Task Force 141 motif -->
  <g fill="#020403">
    <!-- Soldier Body Silhouette -->
    <path d="M420,650 L450,440 L490,410 L510,410 L550,440 L580,650 Z"/>
    <!-- Boonie Hat / Tactical Helmet -->
    <ellipse cx="500" cy="380" rx="46" ry="24"/>
    <path d="M460,380 Q500,340 540,380 Z"/>
    <!-- Quad Night-Vision Goggle Tubes Glowing Green -->
    <circle cx="482" cy="385" r="4.5" fill="#22c55e" filter="url(#cod-glow)"/>
    <circle cx="494" cy="385" r="4.5" fill="#22c55e" filter="url(#cod-glow)"/>
    <circle cx="506" cy="385" r="4.5" fill="#22c55e" filter="url(#cod-glow)"/>
    <circle cx="518" cy="385" r="4.5" fill="#22c55e" filter="url(#cod-glow)"/>
  </g>

  <!-- Red III Numerals -->
  <g fill="#ef4444" opacity="0.85" filter="url(#cod-glow)">
    <rect x="445" y="240" width="26" height="110"/>
    <rect x="487" y="240" width="26" height="110"/>
    <rect x="529" y="240" width="26" height="110"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle" font-family="'Inter', Arial, sans-serif">
    <text x="500" y="160" font-size="28" font-weight="800" letter-spacing="14" fill="#d1d5db">CALL OF DUTY</text>
    <text x="500" y="210" font-size="46" font-weight="900" letter-spacing="6" fill="#ffffff" filter="url(#cod-glow)">MODERN WARFARE III</text>
    <text x="500" y="475" font-size="14" font-weight="700" letter-spacing="8" fill="#ef4444">THE ULTIMATE THREAT HAS AWAKENED</text>
  </g>
</svg>
