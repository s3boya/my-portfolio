<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a12"/>
      <stop offset="50%" stop-color="#2c3a22"/>
      <stop offset="100%" stop-color="#0c100b"/>
    </linearGradient>
    <radialGradient id="cs-flare" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#84cc16" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#141a12" stop-opacity="0"/>
    </radialGradient>
    <filter id="cs-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#cs-bg)"/>
  <circle cx="500" cy="310" r="300" fill="url(#cs-flare)"/>

  <!-- Dust II Bombsite A Arch & Crates -->
  <g fill="#080b07">
    <!-- Archway -->
    <path d="M220,550 L220,240 Q340,160 460,240 L460,550 Z"/>
    <path d="M260,550 L260,280 Q340,210 420,280 L420,550 Z" fill="#141a12"/>
    <!-- Crates / Wooden Boxes -->
    <rect x="580" y="380" width="140" height="140"/>
    <line x1="580" y1="380" x2="720" y2="520" stroke="#1f2c18" stroke-width="2"/>
    <line x1="720" y1="380" x2="580" y2="520" stroke="#1f2c18" stroke-width="2"/>
    <rect x="700" y="420" width="100" height="100"/>
    <rect x="0" y="520" width="1000" height="130"/>
  </g>

  <!-- Tactical Reticle / Crosshair -->
  <g stroke="#84cc16" stroke-width="1.8" opacity="0.75" filter="url(#cs-glow)">
    <circle cx="500" cy="320" r="70" fill="none"/>
    <line x1="500" y1="220" x2="500" y2="280"/>
    <line x1="500" y1="360" x2="500" y2="420"/>
    <line x1="400" y1="320" x2="460" y2="320"/>
    <line x1="540" y1="320" x2="600" y2="320"/>
    <!-- Small center dot -->
    <circle cx="500" cy="320" r="2.5" fill="#84cc16"/>
  </g>

  <!-- Classic CS Operator Silhouette Holding Rifle -->
  <g fill="#020302">
    <ellipse cx="500" cy="430" rx="22" ry="24"/>
    <!-- Helmet & Visor -->
    <path d="M478,425 Q500,410 522,425 L518,445 Q500,450 482,445 Z"/>
    <!-- Shoulders & M4A1 rifle barrel -->
    <path d="M440,520 L470,460 L530,460 L560,520 Z"/>
    <line x1="530" y1="460" x2="620" y2="440" stroke="#020302" stroke-width="8"/>
  </g>

  <!-- Title Artwork -->
  <g text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif">
    <text x="500" y="170" font-size="68" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#cs-glow)">COUNTER-STRIKE</text>
    <text x="500" y="235" font-size="54" font-weight="900" letter-spacing="8" fill="#eab308">1.6 ANTHOLOGY</text>
    <text x="500" y="275" font-size="14" font-weight="700" letter-spacing="8" fill="#84cc16">THE LEGENDARY TACTICAL FPS</text>
  </g>
</svg>
