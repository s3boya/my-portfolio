<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="fc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140a"/>
      <stop offset="50%" stop-color="#0a2e18"/>
      <stop offset="100%" stop-color="#010a05"/>
    </linearGradient>
    <filter id="fc-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#fc-bg)"/>
  <!-- Dynamic Geometric Triangle Grid (Iconic EA Sports FC brand shape) -->
  <g fill="none" stroke="#22c55e" stroke-width="2" opacity="0.4" filter="url(#fc-glow)">
    <polygon points="500,200 420,340 580,340"/>
    <polygon points="500,350 420,490 580,490"/>
    <polygon points="410,345 330,485 490,485"/>
    <polygon points="590,345 510,485 670,485"/>
  </g>
  <!-- Stadium Floodlights Glow -->
  <ellipse cx="200" cy="100" rx="90" ry="20" fill="#ffffff" opacity="0.3" filter="url(#fc-glow)"/>
  <ellipse cx="800" cy="100" rx="90" ry="20" fill="#ffffff" opacity="0.3" filter="url(#fc-glow)"/>
  <g text-anchor="middle" font-family="'Arial Black', 'Inter', sans-serif">
    <text x="500" y="160" font-size="28" font-weight="900" letter-spacing="12" fill="#22c55e">EA SPORTS</text>
    <text x="500" y="230" font-size="80" font-weight="900" letter-spacing="8" fill="#ffffff" filter="url(#fc-glow)">FC 24</text>
    <text x="500" y="275" font-size="16" font-weight="800" letter-spacing="8" fill="#a7f3d0">THE WORLD'S GAME</text>
  </g>
</svg>
