<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="gta-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1024"/>
      <stop offset="30%" stop-color="#541b3d"/>
      <stop offset="65%" stop-color="#c84b31"/>
      <stop offset="90%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
    <radialGradient id="gta-sun" cx="50%" cy="65%" r="35%">
      <stop offset="0%" stop-color="#ffe49e" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f4a261" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c84b31" stop-opacity="0"/>
    </radialGradient>
    <filter id="gta-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#gta-sky)"/>
  <circle cx="500" cy="400" r="180" fill="url(#gta-sun)"/>

  <!-- Vinewood Hills & Skyline Silhouette -->
  <polygon points="-50,520 180,410 360,460 520,380 720,440 880,390 1050,470 1050,650 -50,650" fill="#140b12"/>
  
  <!-- Palm Trees -->
  <g fill="#0e070d">
    <!-- Tree 1 Left -->
    <path d="M120,600 Q140,450 160,340 Q150,340 140,600 Z"/>
    <path d="M160,340 Q110,310 70,330 Q120,335 160,340 Z"/>
    <path d="M160,340 Q140,290 120,270 Q150,310 160,340 Z"/>
    <path d="M160,340 Q190,280 230,270 Q190,310 160,340 Z"/>
    <path d="M160,340 Q220,320 250,340 Q200,340 160,340 Z"/>
    <!-- Tree 2 Right -->
    <path d="M840,600 Q830,470 810,360 Q820,360 850,600 Z"/>
    <path d="M810,360 Q760,320 720,330 Q780,350 810,360 Z"/>
    <path d="M810,360 Q800,300 780,280 Q810,320 810,360 Z"/>
    <path d="M810,360 Q850,290 890,290 Q850,330 810,360 Z"/>
  </g>

  <!-- Police Helicopter Silhouette in Sky -->
  <g fill="#0e070d">
    <ellipse cx="680" cy="220" rx="35" ry="14"/>
    <line x1="620" y1="205" x2="740" y2="205" stroke="#0e070d" stroke-width="3"/>
    <line x1="680" y1="205" x2="680" y2="220" stroke="#0e070d" stroke-width="4"/>
    <rect x="710" y="217" width="40" height="4"/>
    <polygon points="745,210 752,225 745,225"/>
    <!-- Searchlight beam -->
    <polygon points="670,225 480,560 590,560" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- Downtown Skyscrapers Center Silhouette -->
  <g fill="#0a0509">
    <rect x="380" y="320" width="45" height="280"/>
    <rect x="440" y="270" width="70" height="330"/>
    <polygon points="440,270 475,200 510,270"/>
    <rect x="525" y="300" width="55" height="300"/>
    <rect x="595" y="340" width="40" height="260"/>
  </g>

  <!-- Ground Highway -->
  <rect x="0" y="550" width="1000" height="100" fill="#070306"/>
  <line x1="0" y1="560" x2="1000" y2="560" stroke="#f4a261" stroke-width="2" opacity="0.6"/>

  <!-- Iconic GTA V Logo Title -->
  <g text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif">
    <text x="500" y="160" font-size="64" font-weight="900" letter-spacing="4" fill="#ffffff" stroke="#11131a" stroke-width="6" paint-order="stroke fill">GRAND THEFT AUTO</text>
    <text x="500" y="240" font-size="100" font-weight="900" fill="#75a83a" stroke="#ffffff" stroke-width="4" filter="url(#gta-glow)">V</text>
  </g>
</svg>
