<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="rdr-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0505"/>
      <stop offset="35%" stop-color="#600f0f"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="rdr-sun" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#fca5a5" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#dc2626" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a0505" stop-opacity="0"/>
    </radialGradient>
    <filter id="rdr-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#rdr-sky)"/>
  <circle cx="500" cy="360" r="220" fill="url(#rdr-sun)"/>

  <!-- Western Prairie Mountain Ridge -->
  <polygon points="-50,510 180,420 380,470 540,390 760,460 920,410 1050,480 1050,650 -50,650" fill="#0d0202"/>

  <!-- Outlaws on Horseback Silhouettes -->
  <g fill="#020000">
    <!-- Horse 1 & Rider Left -->
    <ellipse cx="280" cy="480" rx="35" ry="18"/>
    <path d="M295,470 L320,440 L310,430 L285,465 Z"/>
    <ellipse cx="285" cy="425" rx="10" ry="14"/>
    <path d="M270,415 L300,415"/>
    <line x1="260" y1="490" x2="255" y2="525" stroke="#020000" stroke-width="4"/>
    <line x1="270" y1="490" x2="270" y2="525" stroke="#020000" stroke-width="4"/>
    <line x1="300" y1="490" x2="305" y2="525" stroke="#020000" stroke-width="4"/>

    <!-- Arthur Morgan Center Outlaw Silhouette with Hat & Rifle -->
    <ellipse cx="500" cy="465" rx="42" ry="20"/>
    <ellipse cx="500" cy="410" rx="14" ry="18"/>
    <!-- Cowboy Hat Brim -->
    <path d="M470,402 Q500,392 530,402 L525,410 Q500,405 475,410 Z"/>
    <!-- Repeating Rifle in hand -->
    <line x1="515" y1="420" x2="550" y2="370" stroke="#020000" stroke-width="3"/>
    <line x1="475" y1="475" x2="470" y2="520" stroke="#020000" stroke-width="5"/>
    <line x1="520" y1="475" x2="525" y2="520" stroke="#020000" stroke-width="5"/>

    <!-- Horse 3 & Rider Right -->
    <ellipse cx="720" cy="485" rx="34" ry="17"/>
    <ellipse cx="720" cy="430" rx="9" ry="13"/>
    <path d="M705,420 L735,420"/>
    <line x1="700" y1="495" x2="695" y2="530" stroke="#020000" stroke-width="4"/>
    <line x1="735" y1="495" x2="740" y2="530" stroke="#020000" stroke-width="4"/>
  </g>

  <!-- Title Artwork -->
  <g text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif">
    <text x="500" y="240" font-size="68" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#rdr-glow)">RED DEAD REDEMPTION</text>
    <text x="500" y="320" font-size="80" font-weight="900" letter-spacing="12" fill="#ffffff">II</text>
  </g>
</svg>
