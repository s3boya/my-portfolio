<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="w3-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1b2436"/>
      <stop offset="100%" stop-color="#3d2a22"/>
    </linearGradient>
    <radialGradient id="w3-moon" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <filter id="w3-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#w3-sky)"/>
  <circle cx="500" cy="280" r="180" fill="url(#w3-moon)"/>
  <!-- Wolf Medallion Silhouette -->
  <g fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#w3-glow)">
    <polygon points="500,220 440,260 460,330 500,380 540,330 560,260"/>
    <!-- Red glowing wolf eyes -->
    <circle cx="480" cy="280" r="4" fill="#ef4444"/>
    <circle cx="520" cy="280" r="4" fill="#ef4444"/>
  </g>
  <!-- Velen Swamps & Windmill Ridge -->
  <polygon points="-50,650 -50,510 240,460 480,510 720,450 1050,520 1050,650" fill="#05070a"/>
  <!-- Silver and Steel Dual Swords -->
  <line x1="430" y1="420" x2="350" y2="580" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="570" y1="420" x2="650" y2="580" stroke="#f59e0b" stroke-width="4"/>
  <g text-anchor="middle" font-family="'Trajan Pro', 'Cinzel', 'Georgia', serif">
    <text x="500" y="140" font-size="24" font-weight="700" letter-spacing="12" fill="#cbd5e1">THE</text>
    <text x="500" y="195" font-size="60" font-weight="900" letter-spacing="10" fill="#ffffff" filter="url(#w3-glow)">WITCHER 3</text>
    <text x="500" y="240" font-size="20" font-weight="800" letter-spacing="12" fill="#ef4444">WILD HUNT</text>
  </g>
</svg>
