<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cp-p-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcee09"/>
      <stop offset="60%" stop-color="#e2d608"/>
      <stop offset="100%" stop-color="#14141c"/>
    </linearGradient>
    <filter id="cp-p-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#cp-p-bg)"/>

  <!-- Cyber Glitch Barcode & Tech Deco -->
  <g fill="#0b0813" opacity="0.8">
    <rect x="30" y="40" width="6" height="40"/>
    <rect x="42" y="40" width="14" height="40"/>
    <rect x="62" y="40" width="4" height="40"/>
    <rect x="72" y="40" width="18" height="40"/>
    <text x="560" y="70" text-anchor="end" font-family="'Courier New', monospace" font-size="16" font-weight="900">VER_2.11</text>
  </g>

  <!-- V Male/Female Silhouette in Samurai Bomber Jacket with Glowing Collar -->
  <g fill="#0b0813">
    <!-- Body in jacket -->
    <path d="M140,800 L200,530 L250,470 L350,470 L400,530 L460,800 Z"/>
    <!-- Head & undercut haircut -->
    <ellipse cx="300" cy="410" rx="38" ry="46"/>
    <!-- Glowing Cyan Collar -->
    <path d="M240,470 Q300,510 360,470 L350,490 Q300,530 250,490 Z" fill="#00f0ff" filter="url(#cp-p-glow)"/>
  </g>

  <!-- Title Top -->
  <g text-anchor="middle" font-family="'Arial Black', 'Inter', sans-serif">
    <text x="300" y="190" font-size="52" font-weight="900" letter-spacing="3" fill="#0b0813">CYBERPUNK</text>
    <text x="300" y="270" font-size="78" font-weight="900" letter-spacing="14" fill="#00f0ff" stroke="#0b0813" stroke-width="4" filter="url(#cp-p-glow)">2077</text>
  </g>

  <rect x="0" y="730" width="600" height="70" fill="#07060b"/>
  <text x="300" y="770" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="900" letter-spacing="6" fill="#fcee09">ULTIMATE EDITION</text>
</svg>
