<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="fc-p-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021209"/>
      <stop offset="50%" stop-color="#09311a"/>
      <stop offset="100%" stop-color="#020d06"/>
    </linearGradient>
    <filter id="fc-p-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#fc-p-bg)"/>

  <!-- Dynamic Green Triangles Grid -->
  <g fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.45" filter="url(#fc-p-glow)">
    <polygon points="300,280 200,450 400,450"/>
    <polygon points="300,460 200,630 400,630"/>
    <polygon points="190,455 90,625 290,625"/>
    <polygon points="410,455 310,625 510,625"/>
  </g>

  <!-- Soccer Ball / Player Silhouette Striking Ball -->
  <circle cx="300" cy="460" r="38" fill="#ffffff" filter="url(#fc-p-glow)"/>
  <circle cx="300" cy="460" r="38" fill="none" stroke="#000000" stroke-width="4"/>
  <!-- Pentagons on ball -->
  <polygon points="300,442 314,453 309,470 291,470 286,453" fill="#000000"/>

  <!-- Title Top -->
  <g text-anchor="middle" font-family="'Arial Black', 'Inter', sans-serif">
    <text x="300" y="110" font-size="24" font-weight="900" letter-spacing="10" fill="#22c55e">EA SPORTS</text>
    <text x="300" y="195" font-size="80" font-weight="900" letter-spacing="6" fill="#ffffff" filter="url(#fc-p-glow)">FC 24</text>
  </g>

  <rect x="0" y="730" width="600" height="70" fill="#010804"/>
  <text x="300" y="770" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="800" letter-spacing="6" fill="#22c55e">STANDARD EDITION</text>
</svg>
