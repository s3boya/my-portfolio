<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="er-p-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0805"/>
      <stop offset="50%" stop-color="#21170a"/>
      <stop offset="100%" stop-color="#080603"/>
    </linearGradient>
    <radialGradient id="er-p-rad" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ca8a04" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0805" stop-opacity="0"/>
    </radialGradient>
    <filter id="er-p-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#er-p-bg)"/>
  <circle cx="300" cy="360" r="230" fill="url(#er-p-rad)"/>

  <!-- Golden Interlocking Elden Ring Arcs -->
  <g stroke="#fde047" stroke-width="2.5" fill="none" opacity="0.8" filter="url(#er-p-glow)">
    <circle cx="300" cy="340" r="130"/>
    <circle cx="300" cy="280" r="90"/>
    <circle cx="250" cy="340" r="90"/>
    <circle cx="350" cy="340" r="90"/>
    <line x1="300" y1="140" x2="300" y2="520" stroke-width="3"/>
  </g>

  <!-- Kneeling Tarnished Silhouette holding Greatsword -->
  <g fill="#020201">
    <ellipse cx="300" cy="460" rx="20" ry="24"/>
    <polygon points="260,540 340,540 325,480 275,480"/>
    <!-- Greatsword plunged in ground glowing -->
    <line x1="300" y1="460" x2="300" y2="620" stroke="#fef08a" stroke-width="4" filter="url(#er-p-glow)"/>
    <line x1="280" y1="490" x2="320" y2="490" stroke="#fef08a" stroke-width="3"/>
  </g>

  <!-- Title Top -->
  <g text-anchor="middle" font-family="'Cinzel', 'Georgia', serif">
    <text x="300" y="100" font-size="44" font-weight="900" letter-spacing="10" fill="#ffffff" filter="url(#er-p-glow)">ELDEN RING</text>
  </g>

  <rect x="0" y="730" width="600" height="70" fill="#050402"/>
  <text x="300" y="770" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="800" letter-spacing="6" fill="#fde047">FROM SOFTWARE</text>
</svg>
