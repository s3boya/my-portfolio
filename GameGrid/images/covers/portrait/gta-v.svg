<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="gta-p-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1124"/>
      <stop offset="35%" stop-color="#702241"/>
      <stop offset="70%" stop-color="#e76f51"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
    <filter id="gta-p-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#gta-p-sky)"/>

  <!-- Comic Box Art Grid Border Aesthetic -->
  <rect x="15" y="15" width="570" height="770" fill="none" stroke="#11131a" stroke-width="8"/>
  <line x1="15" y1="480" x2="585" y2="480" stroke="#11131a" stroke-width="6"/>
  <line x1="300" y1="480" x2="300" y2="785" stroke="#11131a" stroke-width="6"/>

  <!-- Helicopter Silhouette Top Box -->
  <g fill="#0e070d" transform="translate(180, 240) scale(1.1)">
    <ellipse cx="60" cy="40" rx="36" ry="15"/>
    <line x1="0" y1="24" x2="120" y2="24" stroke="#0e070d" stroke-width="3"/>
    <line x1="60" y1="24" x2="60" y2="40" stroke="#0e070d" stroke-width="4"/>
    <rect x="90" y="37" width="40" height="5"/>
    <polygon points="125,30 132,45 125,45"/>
  </g>

  <!-- Palm Tree Silhouette -->
  <path d="M480,480 Q470,300 450,180 Q490,160 520,180 Q470,220 480,480 Z" fill="#0f070e"/>

  <!-- Sports Car Silhouette Bottom Left -->
  <g fill="#140b15" transform="translate(40, 560)">
    <path d="M20,120 L50,80 L160,80 L210,120 Z"/>
    <circle cx="65" cy="125" r="22" fill="#050205"/>
    <circle cx="170" cy="125" r="22" fill="#050205"/>
  </g>

  <!-- Top Logo Banner -->
  <g text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif">
    <text x="300" y="110" font-size="44" font-weight="900" letter-spacing="3" fill="#ffffff" stroke="#11131a" stroke-width="8" paint-order="stroke fill">GRAND THEFT AUTO</text>
    <text x="300" y="210" font-size="94" font-weight="900" fill="#75a83a" stroke="#ffffff" stroke-width="5" filter="url(#gta-p-glow)">V</text>
  </g>

  <rect x="0" y="740" width="600" height="60" fill="#11131a"/>
  <text x="300" y="775" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="800" letter-spacing="6" fill="#f4a261">PREMIUM EDITION</text>
</svg>
