<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="rdr-p-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="rdr-p-sun" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#fca5a5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="rdr-p-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#rdr-p-bg)"/>
  <circle cx="300" cy="380" r="230" fill="url(#rdr-p-sun)"/>

  <!-- Arthur Morgan Outlaw Silhouette with Stalker Hat and Shotgun -->
  <g fill="#020000">
    <ellipse cx="300" cy="390" rx="30" ry="34"/>
    <!-- Cowboy Hat Brim -->
    <path d="M230,375 Q300,355 370,375 L360,390 Q300,380 240,390 Z"/>
    <!-- Body & Coat -->
    <path d="M180,800 L230,480 L370,480 L420,800 Z"/>
    <!-- Shotgun resting over shoulder -->
    <line x1="280" y1="440" x2="220" y2="330" stroke="#020000" stroke-width="8"/>
  </g>

  <!-- Title Top -->
  <g text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif">
    <text x="300" y="100" font-size="44" font-weight="900" letter-spacing="3" fill="#ffffff" filter="url(#rdr-p-glow)">RED DEAD</text>
    <text x="300" y="150" font-size="36" font-weight="900" letter-spacing="4" fill="#ffffff">REDEMPTION</text>
    <text x="300" y="240" font-size="96" font-weight="900" letter-spacing="8" fill="#ffffff" stroke="#11131a" stroke-width="4">II</text>
  </g>

  <rect x="0" y="730" width="600" height="70" fill="#180303"/>
  <text x="300" y="770" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="900" letter-spacing="6" fill="#fca5a5">ROCKSTAR GAMES</text>
</svg>
