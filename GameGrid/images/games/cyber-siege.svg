<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="cy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081014"/>
      <stop offset="50%" stop-color="#0e1f26"/>
      <stop offset="100%" stop-color="#04070a"/>
    </linearGradient>
    <filter id="cy-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#cy-bg)"/>
  <!-- Hex Shield Grid -->
  <g stroke="#00f5d4" stroke-width="1.5" fill="none" opacity="0.4" filter="url(#cy-glow)">
    <polygon points="500,200 560,235 560,305 500,340 440,305 440,235"/>
    <polygon points="560,305 620,340 620,410 560,445 500,410 500,340"/>
    <polygon points="440,305 500,340 500,410 440,445 380,410 380,340"/>
    <polygon points="500,340 560,375 560,445 500,480 440,445 440,375" stroke="#7b2cbf" stroke-width="2.5"/>
  </g>
  <!-- Cyber Breach Operative Silhouette -->
  <g fill="#070c0e">
    <rect x="0" y="520" width="1000" height="130"/>
    <!-- Operative kneeling -->
    <path d="M470,520 L480,460 L500,430 L520,460 L540,520 Z"/>
    <circle cx="500" cy="410" r="16"/>
    <!-- Cyan Visor -->
    <rect x="492" y="406" width="16" height="5" rx="2" fill="#00f5d4" filter="url(#cy-glow)"/>
  </g>
  <g text-anchor="middle" font-family="'Inter', sans-serif">
    <text x="500" y="190" font-size="76" font-weight="900" letter-spacing="14" fill="#ffffff" filter="url(#cy-glow)">CYBER SIEGE</text>
    <text x="500" y="230" font-size="15" font-weight="700" letter-spacing="8" fill="#00f5d4">TACTICAL BREACH PROTOCOL</text>
  </g>
</svg>
