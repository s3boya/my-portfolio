<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="dp-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1610"/>
      <stop offset="50%" stop-color="#3b2b1b"/>
      <stop offset="100%" stop-color="#0f0c08"/>
    </linearGradient>
    <radialGradient id="dp-haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1c1610" stop-opacity="0"/>
    </radialGradient>
    <filter id="dp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#dp-bg)"/>
  <circle cx="500" cy="325" r="400" fill="url(#dp-haze)"/>

  <!-- Military Tactical Compound Silhouettes -->
  <g fill="#0e0b07">
    <!-- Watchtower Left -->
    <rect x="140" y="320" width="20" height="240"/>
    <rect x="220" y="320" width="20" height="240"/>
    <line x1="140" y1="340" x2="240" y2="440" stroke="#0e0b07" stroke-width="10"/>
    <line x1="240" y1="340" x2="140" y2="440" stroke="#0e0b07" stroke-width="10"/>
    <rect x="120" y="270" width="140" height="60"/>
    <line x1="190" y1="270" x2="190" y2="200" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Bunker & Radar Dome -->
    <rect x="360" y="360" width="280" height="200"/>
    <ellipse cx="500" cy="360" rx="90" ry="70"/>
    
    <!-- Industrial Gantry Right -->
    <rect x="760" y="290" width="160" height="270"/>
    <polygon points="760,290 840,220 920,290"/>
    
    <!-- Ground Line -->
    <rect x="0" y="520" width="1000" height="130"/>
  </g>

  <!-- Tactical HUD & Crosshairs -->
  <g stroke="#f59e0b" stroke-width="1.5" opacity="0.75" filter="url(#dp-glow)">
    <!-- HUD Center Reticle -->
    <circle cx="500" cy="310" r="80" fill="none" stroke-dasharray="40 20"/>
    <circle cx="500" cy="310" r="140" fill="none" stroke-dasharray="10 15 60 15"/>
    <line x1="500" y1="150" x2="500" y2="210"/>
    <line x1="500" y1="410" x2="500" y2="470"/>
    <line x1="340" y1="310" x2="400" y2="310"/>
    <line x1="600" y1="310" x2="660" y2="310"/>
    <!-- HUD Data Readouts -->
    <rect x="780" y="100" width="140" height="40" fill="none" stroke-width="1"/>
    <text x="795" y="125" font-family="'Courier New', monospace" font-size="12" fill="#f59e0b" font-weight="700">SYS_LOCK: 99.4%</text>
  </g>

  <!-- Operative Silhouette with Red Optics -->
  <g fill="#080604">
    <!-- Soldier Head & Helmet -->
    <circle cx="500" cy="460" r="30"/>
    <!-- Shoulders & Vest -->
    <path d="M430,530 L450,480 L550,480 L570,530 Z"/>
    <!-- Night Vision Dual Red Dot Optics -->
    <circle cx="493" cy="455" r="3" fill="#ef4444" filter="url(#dp-glow)"/>
    <circle cx="507" cy="455" r="3" fill="#ef4444" filter="url(#dp-glow)"/>
  </g>

  <!-- Title Artwork -->
  <g text-anchor="middle" font-family="'Inter', sans-serif">
    <text x="500" y="240" font-size="76" font-weight="900" letter-spacing="14" fill="#ffffff" filter="url(#dp-glow)">DUST PROTOCOL</text>
    <text x="500" y="280" font-size="15" font-weight="700" letter-spacing="9" fill="#f59e0b">TACTICAL SPECIAL OPERATIONS</text>
  </g>
</svg>
