<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="nr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a071b"/>
      <stop offset="50%" stop-color="#150f38"/>
      <stop offset="100%" stop-color="#070513"/>
    </linearGradient>
    <linearGradient id="nr-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6c4cff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00a9c7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nr-grid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6c4cff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="nr-sun" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ff3399" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a071b" stop-opacity="0"/>
    </radialGradient>
    <filter id="nr-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#nr-bg)"/>
  <circle cx="500" cy="380" r="300" fill="url(#nr-sun)"/>

  <!-- City Skyline Silhouettes -->
  <g fill="#0b081e" opacity="0.95">
    <rect x="60" y="240" width="70" height="410"/>
    <rect x="150" y="190" width="85" height="460"/>
    <rect x="260" y="260" width="60" height="390"/>
    <rect x="340" y="160" width="110" height="490"/>
    <polygon points="340,160 395,90 450,160"/>
    <rect x="470" y="220" width="90" height="430"/>
    <rect x="580" y="140" width="120" height="510"/>
    <line x1="640" y1="140" x2="640" y2="70" stroke="#00e5ff" stroke-width="3" filter="url(#nr-bloom)"/>
    <rect x="720" y="230" width="80" height="420"/>
    <rect x="820" y="180" width="100" height="470"/>
  </g>

  <!-- Glowing Building Windows & Neon Streaks -->
  <g opacity="0.75">
    <line x1="395" y1="90" x2="395" y2="350" stroke="#ff007f" stroke-width="2" filter="url(#nr-bloom)"/>
    <line x1="640" y1="140" x2="640" y2="380" stroke="#00e5ff" stroke-width="2.5" filter="url(#nr-bloom)"/>
    <rect x="170" y="210" width="45" height="8" fill="#6c4cff"/>
    <rect x="170" y="230" width="45" height="8" fill="#00e5ff"/>
    <rect x="170" y="250" width="45" height="8" fill="#ff007f"/>
    <rect x="490" y="250" width="50" height="6" fill="#00e5ff"/>
    <rect x="490" y="270" width="50" height="6" fill="#6c4cff"/>
    <rect x="740" y="260" width="40" height="6" fill="#ff007f"/>
    <rect x="740" y="280" width="40" height="6" fill="#00e5ff"/>
    <rect x="840" y="210" width="60" height="8" fill="#6c4cff"/>
    <rect x="840" y="230" width="60" height="8" fill="#00e5ff"/>
  </g>

  <!-- Perspective Cyber Grid Ground -->
  <g stroke="url(#nr-grid-grad)" stroke-width="1.5" opacity="0.8">
    <line x1="0" y1="480" x2="1000" y2="480"/>
    <line x1="0" y1="510" x2="1000" y2="510"/>
    <line x1="0" y1="545" x2="1000" y2="545"/>
    <line x1="0" y1="585" x2="1000" y2="585"/>
    <line x1="0" y1="630" x2="1000" y2="630"/>

    <line x1="500" y1="450" x2="-200" y2="650"/>
    <line x1="500" y1="450" x2="0" y2="650"/>
    <line x1="500" y1="450" x2="200" y2="650"/>
    <line x1="500" y1="450" x2="380" y2="650"/>
    <line x1="500" y1="450" x2="500" y2="650"/>
    <line x1="500" y1="450" x2="620" y2="650"/>
    <line x1="500" y1="450" x2="800" y2="650"/>
    <line x1="500" y1="450" x2="1000" y2="650"/>
    <line x1="500" y1="450" x2="1200" y2="650"/>
  </g>

  <!-- Laser Beams / Rifts -->
  <path d="M-50,620 L480,450 L1050,470" stroke="#00e5ff" stroke-width="3" fill="none" filter="url(#nr-bloom)"/>
  <path d="M-20,630 L520,450 L1020,490" stroke="#ff007f" stroke-width="2" fill="none" filter="url(#nr-bloom)"/>

  <!-- Dramatic Center Title Art Overlay -->
  <g text-anchor="middle" font-family="'Inter', sans-serif">
    <text x="500" y="375" font-size="76" font-weight="900" letter-spacing="14" fill="#ffffff" filter="url(#nr-bloom)">NEON RIFT</text>
    <text x="500" y="415" font-size="16" font-weight="700" letter-spacing="8" fill="#00e5ff">THE QUANTUM METROPOLIS</text>
  </g>
</svg>
