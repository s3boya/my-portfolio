<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="va-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100b08"/>
      <stop offset="50%" stop-color="#241208"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>
    <linearGradient id="va-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff5400" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="1"/>
    </linearGradient>
    <filter id="va-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="650" fill="url(#va-bg)"/>
  <!-- Racing Track Curving Perspective -->
  <path d="M-100,650 L460,350 L540,350 L1100,650 Z" fill="#141416"/>
  <!-- Glowing Apex Kerbs -->
  <path d="M-100,650 L460,350" stroke="#ff0055" stroke-width="8" stroke-dasharray="25 15" filter="url(#va-glow)"/>
  <path d="M1100,650 L540,350" stroke="#00f0ff" stroke-width="8" stroke-dasharray="25 15" filter="url(#va-glow)"/>
  <!-- Hypercar Light Trails -->
  <path d="M500,380 Q480,450 350,560" stroke="url(#va-light)" stroke-width="5" fill="none" filter="url(#va-glow)"/>
  <path d="M505,380 Q525,450 650,560" stroke="url(#va-light)" stroke-width="5" fill="none" filter="url(#va-glow)"/>
  <!-- Taillights of Lead Car -->
  <rect x="470" y="380" width="25" height="6" rx="2" fill="#ff0055" filter="url(#va-glow)"/>
  <rect x="505" y="380" width="25" height="6" rx="2" fill="#ff0055" filter="url(#va-glow)"/>
  <g text-anchor="middle" font-family="'Inter', sans-serif">
    <text x="500" y="220" font-size="76" font-weight="900" letter-spacing="14" fill="#ffffff" filter="url(#va-glow)">VELOCITY APEX</text>
    <text x="500" y="260" font-size="15" font-weight="700" letter-spacing="8" fill="#ffb703">PURE STREET RACING PRECISION</text>
  </g>
</svg>
