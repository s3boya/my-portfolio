<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="wb-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1d37"/>
      <stop offset="45%" stop-color="#1b4965"/>
      <stop offset="75%" stop-color="#62b6cb"/>
      <stop offset="100%" stop-color="#bee9e8"/>
    </linearGradient>
    <linearGradient id="wb-sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b4965"/>
      <stop offset="30%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#041224"/>
    </linearGradient>
    <radialGradient id="wb-glow-rad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00bbf9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="wb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#wb-sky)"/>

  <!-- Distant Tropical Island Atolls -->
  <polygon points="40,430 140,380 260,430" fill="#133c55"/>
  <polygon points="220,435 340,360 480,435" fill="#0d2b3e"/>
  <polygon points="680,435 800,350 940,435" fill="#0d2b3e"/>
  <polygon points="880,430 960,390 1040,430" fill="#133c55"/>

  <!-- Horizon & Sun Glow -->
  <circle cx="500" cy="420" r="140" fill="url(#wb-glow-rad)"/>

  <!-- Stylized Ocean Waves Layering -->
  <!-- Back wave -->
  <path d="M0,430 Q250,400 500,430 T1000,430 L1000,650 L0,650 Z" fill="#173f5f" opacity="0.8"/>
  <!-- Mid wave -->
  <path d="M0,470 Q250,440 500,470 T1000,470 L1000,650 L0,650 Z" fill="#102f4a"/>
  <!-- Front wave -->
  <path d="M0,520 Q250,490 500,520 T1000,520 L1000,650 L0,650 Z" fill="url(#wb-sea)"/>

  <!-- Leaping Bioluminescent Manta Silhouette with Cyan Glow -->
  <g filter="url(#wb-glow)">
    <!-- Wings & Body -->
    <path d="M500,320 Q560,280 620,310 Q560,340 520,380 Q480,340 380,310 Q440,280 500,320 Z" fill="#02111b" stroke="#00f5d4" stroke-width="2.5"/>
    <!-- Whip tail -->
    <path d="M510,380 Q520,430 505,470" fill="none" stroke="#00f5d4" stroke-width="2"/>
    <!-- Glowing Luminescent Wing Spots -->
    <circle cx="450" cy="318" r="3" fill="#00f5d4"/>
    <circle cx="475" cy="328" r="2.5" fill="#00f5d4"/>
    <circle cx="500" cy="335" r="3" fill="#00f5d4"/>
    <circle cx="525" cy="328" r="2.5" fill="#00f5d4"/>
    <circle cx="550" cy="318" r="3" fill="#00f5d4"/>
  </g>

  <!-- Water Splash Drops -->
  <g fill="#00f5d4" opacity="0.7" filter="url(#wb-glow)">
    <circle cx="485" cy="400" r="3"/>
    <circle cx="525" cy="405" r="2"/>
    <circle cx="510" cy="425" r="2.5"/>
  </g>

  <!-- Title Artwork -->
  <g text-anchor="middle" font-family="'Inter', sans-serif">
    <text x="500" y="230" font-size="80" font-weight="900" letter-spacing="16" fill="#ffffff" filter="url(#wb-glow)">WAVEBOUND</text>
    <text x="500" y="270" font-size="16" font-weight="700" letter-spacing="8" fill="#00f5d4">OCEAN REALM EXPLORATION</text>
  </g>
</svg>
