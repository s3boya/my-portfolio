<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="wl-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="40%" stop-color="#1d2e3d"/>
      <stop offset="70%" stop-color="#4a3b32"/>
      <stop offset="100%" stop-color="#8a532d"/>
    </linearGradient>
    <radialGradient id="wl-sun" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#ffb86c" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e27d60" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d2e3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="wl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#wl-sky)"/>
  <circle cx="500" cy="360" r="220" fill="url(#wl-sun)"/>

  <!-- Distant Mountain Peaks -->
  <polygon points="-50,440 180,260 380,420 540,240 760,450 920,290 1050,460 1050,650 -50,650" fill="#18222d" opacity="0.85"/>
  <polygon points="180,260 210,310 180,330 150,300" fill="#ffffff" opacity="0.3"/>
  <polygon points="540,240 570,290 535,320 500,285" fill="#ffffff" opacity="0.4"/>
  <polygon points="920,290 945,330 915,350 890,320" fill="#ffffff" opacity="0.3"/>

  <!-- Mid-ground Ridge -->
  <polygon points="-50,490 260,380 490,460 740,370 1050,510 1050,650 -50,650" fill="#111920"/>

  <!-- Dense Pine Forests Layers -->
  <g fill="#0b1116">
    <!-- Forest tree row 1 -->
    <path d="M-20,530 L20,470 L60,530 L100,460 L140,530 L190,450 L240,530 L300,470 L350,540 L410,460 L470,540 L530,480 L590,550 L660,460 L730,540 L800,470 L870,550 L930,460 L1020,550 L1020,650 L-20,650 Z"/>
  </g>

  <!-- Foreground Lake Reflection -->
  <rect x="0" y="550" width="1000" height="100" fill="#070c10"/>
  <ellipse cx="500" cy="565" rx="350" ry="12" fill="#ffb86c" opacity="0.25" filter="url(#wl-glow)"/>
  
  <!-- Birds / Soaring Eagles -->
  <path d="M380,220 Q390,210 400,220 Q410,210 420,220 Q410,216 400,223 Q390,216 380,220 Z" fill="#ffffff" opacity="0.7"/>
  <path d="M430,240 Q438,232 445,240 Q452,232 460,240 Q452,237 445,242 Q438,237 430,240 Z" fill="#ffffff" opacity="0.5"/>

  <!-- Bold Title Artwork -->
  <g text-anchor="middle" font-family="'Inter', sans-serif">
    <text x="500" y="320" font-size="80" font-weight="900" letter-spacing="16" fill="#ffffff" filter="url(#wl-glow)">WILDLANDS</text>
    <text x="500" y="360" font-size="16" font-weight="700" letter-spacing="8" fill="#ffb86c">SURVIVE THE UNCHARTED FRONTIER</text>
  </g>
</svg>
